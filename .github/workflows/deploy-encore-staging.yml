# Author: Klaasvaakie ( |╲ )
name: Deploy Encore staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: encore-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install Encore CLI
        run: curl -L https://encore.dev/install.sh | bash
      - name: Add Encore to path
        run: echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Authenticate Encore deployment
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          test -n "$ENCORE_AUTH_KEY"
          encore auth login --auth-key "$ENCORE_AUTH_KEY"
      - name: Trust Encore Git host
        run: |
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H git.encore.dev >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Build fast-forward deploy commit
        id: deploy
        run: |
          git remote add encore encore://kasihub-ygb2
          git fetch encore main
          subtree_sha=$(git subtree split --prefix encore HEAD)
          subtree_tree=$(git rev-parse "${subtree_sha}^{tree}")
          git config user.name "KaSiHUB Deployment"
          git config user.email "deploy@kasihub.invalid"
          deploy_sha=$(printf 'Deploy KaSiHUB backend %s\n' "${GITHUB_SHA}" | git commit-tree "$subtree_tree" -p refs/remotes/encore/main)
          echo "sha=$deploy_sha" >> "$GITHUB_OUTPUT"
      - name: Deploy to Encore staging
        run: git push encore "${{ steps.deploy.outputs.sha }}:refs/heads/main"
      - name: Verify Encore staging activation
        env:
          ENCORE_STAGING_URL: https://staging-kasihub-ygb2.encr.app
        run: |
          for attempt in $(seq 1 30); do
            response=$(curl --fail-with-body --silent --show-error \
              --header 'Content-Type: application/json' \
              --data '{"citizenshipType":"FOREIGN_CITIZEN_ABROAD","membershipType":"INDIVIDUAL_ADULT"}' \
              "$ENCORE_STAGING_URL/routing/registration") || true
            if jq -e '
              .isInternational == true and
              .kycRail == "kasihub_international" and
              .paymentRail == "usdt" and
              .membershipPlanCode == "INDIVIDUAL_INTERNATIONAL" and
              .kycRequired == true
            ' <<<"$response" >/dev/null; then
              exit 0
            fi
            sleep 10
          done

          echo "Encore staging did not expose the expected registration policy contract." >&2
          exit 1
