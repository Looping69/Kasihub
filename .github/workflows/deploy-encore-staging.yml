# Author: Klaasvaakie ( |╲ )
name: Deploy Encore staging

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to deploy
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: encore-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - name: Install Encore CLI
        run: curl -L https://encore.dev/install.sh | bash
      - name: Add Encore to path
        run: echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Authenticate Encore deployment
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          test -n "$ENCORE_AUTH_KEY"
          encore auth login --auth-key "$ENCORE_AUTH_KEY"
      - name: Build deploy commit
        id: subtree
        run: echo "sha=$(git subtree split --prefix encore HEAD)" >> "$GITHUB_OUTPUT"
      - name: Trust Encore Git host
        run: |
          install -d -m 700 "$HOME/.ssh"
          ssh-keyscan -H git.encore.dev >> "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
      - name: Deploy to Encore staging
        run: git push encore://kasihub-ygb2 "${{ steps.subtree.outputs.sha }}:refs/heads/main"
