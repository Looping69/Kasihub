name: Manage Encore administrator

on:
  workflow_dispatch:
    inputs:
      email:
        description: Exact registered account email
        required: true
        type: string
      action:
        description: Administrator role operation
        required: true
        default: grant
        type: choice
        options:
          - grant
          - revoke

permissions:
  contents: read

jobs:
  manage-role:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encore
    steps:
      - uses: actions/checkout@v5
      - name: Validate input
        env:
          TARGET_EMAIL: ${{ inputs.email }}
        run: |
          node -e "const email=process.env.TARGET_EMAIL; if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) process.exit(1)"
      - name: Install Encore CLI
        run: curl -L https://encore.dev/install.sh | bash
      - name: Authenticate Encore
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          test -n "$ENCORE_AUTH_KEY"
          echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
          "$HOME/.encore/bin/encore" auth login --auth-key "$ENCORE_AUTH_KEY"
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Apply administrator role
        env:
          TARGET_EMAIL: ${{ inputs.email }}
          ROLE_ACTION: ${{ inputs.action }}
        run: |
          database_url="$(encore db conn-uri identity --env=staging)"
          if [ "$ROLE_ACTION" = "grant" ]; then
            affected="$(psql "$database_url" --no-psqlrc --tuples-only --set=ON_ERROR_STOP=1 --set=target_email="$TARGET_EMAIL" <<'SQL'
          WITH target AS (
            SELECT id FROM users WHERE lower(email) = lower(:'target_email')
          ), inserted AS (
            INSERT INTO user_roles (user_id, role_id)
            SELECT target.id, roles.id
            FROM target CROSS JOIN roles
            WHERE roles.name = 'admin'
            ON CONFLICT (user_id, role_id) DO NOTHING
            RETURNING user_id
          )
          SELECT count(*) FROM target;
          SQL
            )"
          else
            affected="$(psql "$database_url" --no-psqlrc --tuples-only --set=ON_ERROR_STOP=1 --set=target_email="$TARGET_EMAIL" <<'SQL'
          WITH target AS (
            SELECT id FROM users WHERE lower(email) = lower(:'target_email')
          ), removed AS (
            DELETE FROM user_roles
            WHERE user_id IN (SELECT id FROM target)
              AND role_id = (SELECT id FROM roles WHERE name = 'admin')
            RETURNING user_id
          )
          SELECT count(*) FROM target;
          SQL
            )"
          fi
          test "$(echo "$affected" | tr -d '[:space:]')" = "1"
          echo "Administrator role action completed for one registered identity."
