# Author: Klaasvaakie ( |╲ )
name: KaSiHUB quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:production
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  encore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: encore/package-lock.json
      - run: npm ci
      - name: Install Encore CLI
        run: curl -L https://encore.dev/install.sh | bash
      - name: Add Encore to path
        run: echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - run: encore check
      - run: encore test
