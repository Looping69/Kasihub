# Author: Klaasvaakie ( |╲ )
name: KaSiHUB quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - name: Upload critical server coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-server-coverage
          path: coverage/critical-server
          if-no-files-found: error
      - run: npm run audit:production
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  encore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: encore
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: encore/package-lock.json
      - run: npm ci
      - name: Install Encore CLI
        run: curl -L https://encore.dev/install.sh | bash
      - name: Add Encore to path
        run: echo "$HOME/.encore/bin" >> "$GITHUB_PATH"
      - name: Authenticate Encore CI
        env:
          ENCORE_AUTH_KEY: ${{ secrets.ENCORE_AUTH_KEY }}
        run: |
          test -n "$ENCORE_AUTH_KEY"
          encore auth login --auth-key "$ENCORE_AUTH_KEY"
      - run: encore check
      - run: encore test -- --coverage
      - name: Upload Encore core coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: encore-core-coverage
          path: encore/coverage/backend
          if-no-files-found: error
